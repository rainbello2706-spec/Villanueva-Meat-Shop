
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d63384">
<title>Villanueva Meat Shop</title>

<style>
:root {
  --pink: #d63384;
  --pink-dark: #b51f68;
  --pink-light: #ffe5ef;
  --background: #fff5f8;
  --card: #ffffff;
  --text: #492333;
  --muted: #936b7c;
  --border: #f2d5e1;
  --green: #27834f;
  --warning: #b86a00;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  padding-bottom: calc(82px + env(safe-area-inset-bottom));
  background: var(--background);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.45;
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible {
  outline: 3px solid #e879ad;
  outline-offset: 2px;
}

header {
  padding: 20px 17px;
  background: linear-gradient(135deg, #d63384, #f276ae);
  color: white;
  border-radius: 0 0 23px 23px;
}

header h1 {
  margin: 0;
  font-size: 1.4rem;
}

header p {
  margin: 5px 0 0;
  font-size: .83rem;
  color: #fff0f6;
}

main {
  width: 100%;
  max-width: 1050px;
  margin: auto;
  padding: 15px 12px;
}

.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 4px 15px #a72c6210;
}

.panel h2 {
  font-size: 1rem;
  margin: 0 0 12px;
}

.advert {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 19px;
  border-radius: 19px;
  margin-bottom: 14px;
  color: white;
  background: linear-gradient(120deg, #c62575, #f18db8);
  overflow: hidden;
}

.advert h2 {
  font-size: 1.25rem;
  line-height: 1.2;
  margin: 5px 0;
}

.advert p {
  font-size: .8rem;
  margin: 0 0 10px;
}

.advert .eyebrow {
  font-size: .68rem;
  font-weight: bold;
  letter-spacing: 1px;
}

.advert .art {
  font-size: 3rem;
}

.advert button {
  background: white;
  color: var(--pink-dark);
  border: 0;
  border-radius: 10px;
  padding: 9px 13px;
  font-size: .8rem;
  font-weight: bold;
}

.delivery-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border-radius: 15px;
  background: white;
  border: 1px solid var(--border);
  margin-bottom: 15px;
}

.delivery-icon {
  background: var(--pink-light);
  width: 43px;
  height: 43px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: 23px;
  flex-shrink: 0;
}

.delivery-card strong {
  font-size: .88rem;
}

.delivery-card small {
  display: block;
  color: var(--muted);
  font-size: .76rem;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 18px 2px 10px;
  font-weight: bold;
}

.section-title small {
  color: var(--pink);
  font-size: .75rem;
}

.pos {
  display: grid;
  gap: 14px;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.product {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 11px;
  text-align: left;
  color: var(--text);
  min-width: 0;
  transition: transform .15s;
}

.product:active {
  transform: scale(.97);
}

.product:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.product .emoji {
  height: 66px;
  display: grid;
  place-items: center;
  background: var(--pink-light);
  border-radius: 12px;
  font-size: 36px;
  margin-bottom: 9px;
}

.product strong {
  display: block;
  font-size: .88rem;
  overflow-wrap: anywhere;
}

.product .stock {
  display: block;
  font-size: .72rem;
  color: var(--muted);
  margin-top: 4px;
}

.product .price {
  display: block;
  color: var(--pink);
  font-weight: bold;
  font-size: .92rem;
  margin-top: 6px;
}

.product .add-label {
  display: block;
  margin-top: 9px;
  padding: 7px 5px;
  border-radius: 9px;
  background: var(--pink-light);
  color: var(--pink-dark);
  text-align: center;
  font-size: .75rem;
  font-weight: bold;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid #f5e8ee;
  font-size: .86rem;
}

.row:last-child {
  border-bottom: 0;
}

.qty {
  display: flex;
  align-items: center;
  gap: 7px;
}

.qty button {
  width: 29px;
  height: 29px;
  border: 1px solid var(--border);
  background: var(--pink-light);
  color: var(--pink-dark);
  border-radius: 9px;
  font-weight: bold;
}

.total {
  display: flex;
  justify-content: space-between;
  padding-top: 14px;
  font-weight: bold;
  font-size: 1.15rem;
}

.cta, .small-btn {
  border: 0;
  background: var(--pink);
  color: white;
  font-weight: bold;
  border-radius: 11px;
}

.cta {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
}

.cta:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.small-btn {
  padding: 9px 12px;
  font-size: .82rem;
}

input, select, textarea {
  width: 100%;
  max-width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 10px;
  color: var(--text);
}

input.n {
  width: 90px;
}

.form {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.form > * {
  flex: 1 1 110px;
  min-width: 0;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.stat {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 13px;
  min-width: 0;
  overflow-wrap: anywhere;
}

.stat b {
  display: block;
  color: var(--pink);
  font-size: 1.05rem;
}

.stat span {
  font-size: .76rem;
  color: var(--muted);
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: .8rem;
}

td, th {
  text-align: left;
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

th {
  background: var(--pink-light);
}

.tag {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 99px;
  background: var(--pink-light);
  color: var(--pink-dark);
  font-size: .72rem;
}

.low {
  color: var(--warning);
}

.ok {
  color: var(--green);
}

.design-grid {
  display: grid;
  gap: 13px;
}

.design-grid h3 {
  margin: 0;
  color: var(--pink-dark);
  font-size: .9rem;
}

.design-grid p {
  margin: 4px 0 0;
  font-size: .84rem;
}

.bottom-nav {
  position: fixed;
  z-index: 20;
  bottom: 0;
  left: 0;
  right: 0;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  background: #fff;
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 18px #7820440c;
}

.bottom-nav button {
  border: 0;
  background: transparent;
  color: #9b7a89;
  padding: 4px 1px;
  min-width: 0;
  font-size: .66rem;
}

.bottom-nav button .icon {
  display: block;
  font-size: 1.25rem;
  margin-bottom: 3px;
}

.bottom-nav button[aria-selected="true"] {
  color: var(--pink);
  font-weight: bold;
}

.toast {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: 95px;
  transform: translateX(-50%);
  max-width: 90%;
  background: #492333;
  color: white;
  padding: 11px 16px;
  border-radius: 12px;
  font-size: .84rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}

.toast.show {
  opacity: 1;
}

[hidden] {
  display: none !important;
}

@media (min-width: 700px) {
  main {
    padding: 22px;
  }

  .pos {
    grid-template-columns: 1.5fr 1fr;
    align-items: start;
  }

  .products {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .stats {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .design-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .bottom-nav {
    max-width: 600px;
    left: 50%;
    right: auto;
    width: 100%;
    transform: translateX(-50%);
    border: 1px solid var(--border);
    border-bottom: 0;
    border-radius: 18px 18px 0 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎀 Villanueva Meat Shop</h1>
  <p>Fresh cuts, happy meals, easy ordering 💗</p>
</header>

<main id="view"></main>

<nav class="bottom-nav" id="nav" aria-label="Main navigation"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* SETTINGS */
const CONFIG = {
  key: "villanueva.pink.app.v1",
  lowStock: 5,
  step: 0.5,
  maxLog: 200,
  payments: ["Cash", "GCash", "Card"]
};

const TABS = [
  ["sell", "Shop", "🏠"],
  ["inv", "Stock", "📦"],
  ["rep", "Sales", "📊"],
  ["log", "Activity", "🧾"],
  ["design", "System", "⚙️"]
];

const SEED = [
  {name:"Pork Belly", price:280, stock:20, unit:"kg", emoji:"🥓"},
  {name:"Beef Sirloin", price:520, stock:10, unit:"kg", emoji:"🥩"},
  {name:"Ground Beef", price:380, stock:12, unit:"kg", emoji:"🍖"},
  {name:"Longganisa", price:60, stock:30, unit:"pc", emoji:"🌭"},
  {name:"Bacon", price:45, stock:4, unit:"pc", emoji:"🥓"}
];

let db = {products:[], sales:[], log:[], seq:1};
let tab = "sell";
let cart = {};
let disc = 0;
let pay = "Cash";
let fulfillment = "Pickup";
let deliveryAddress = "";

const $ = selector => document.querySelector(selector);

const esc = value => String(value).replace(/[&<>"']/g, c => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[c]));

const peso = value => "₱" + Number(value).toLocaleString("en-PH", {
  minimumFractionDigits:2,
  maximumFractionDigits:2
});

const when = time => new Date(time).toLocaleString("en-PH", {
  dateStyle:"short",
  timeStyle:"short"
});

const byId = id => db.products.find(p => p.id === id);
const round2 = n => Math.round(n * 100) / 100;

function toast(message) {
  const el = $("#toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 2500);
}

function audit(action, detail) {
  db.log.unshift({t:Date.now(), action, detail});
  db.log = db.log.slice(0, CONFIG.maxLog);
}

function save() {
  try {
    localStorage.setItem(CONFIG.key, JSON.stringify(db));
  } catch (error) {
    toast("Unable to save in this browser.");
  }
}

function load() {
  try {
    const saved = localStorage.getItem(CONFIG.key);
    if (saved) db = JSON.parse(saved);
  } catch (error) {
    db = {products:[], sales:[], log:[], seq:1};
  }

  if (!db || typeof db !== "object") {
    db = {products:[], sales:[], log:[], seq:1};
  }

  if (!Array.isArray(db.products)) db.products = [];
  if (!Array.isArray(db.sales)) db.sales = [];
  if (!Array.isArray(db.log)) db.log = [];
  if (!Number.isFinite(db.seq)) db.seq = 1;

  // Remove Chicken Breast from existing saved inventory.
  const oldLength = db.products.length;
  db.products = db.products.filter(p =>
    String(p.name || "").trim().toLowerCase() !== "chicken breast"
  );

  if (oldLength !== db.products.length) {
    audit("SYSTEM", "Removed Chicken Breast from inventory");
  }

  if (!db.products.length) {
    SEED.forEach(item => {
      db.products.push({
        id:db.seq++,
        ...item
      });
    });
    audit("SYSTEM", "Sample products loaded");
  }

  save();
}

function lines() {
  return Object.entries(cart)
    .map(([id, qty]) => ({p:byId(Number(id)), q:qty}))
    .filter(item => item.p);
}

function subtotal() {
  return lines().reduce((sum, item) =>
    sum + item.p.price * item.q, 0);
}

function total() {
  return Math.max(0, subtotal() * (1 - disc / 100));
}

function productEmoji(product) {
  if (product.emoji) return product.emoji;

  const name = product.name.toLowerCase();
  if (name.includes("pork")) return "🥓";
  if (name.includes("beef")) return "🥩";
  if (name.includes("bacon")) return "🥓";
  if (name.includes("sausage") || name.includes("longganisa")) return "🌭";
  return "🍖";
}

/* SHOP SCREEN */
function vSell() {
  const L = lines();

  const products = db.products.map(p => `
    <button class="product" data-add="${p.id}"
      ${p.stock <= 0 ? "disabled" : ""}>
      <span class="emoji">${productEmoji(p)}</span>
      <strong>${esc(p.name)}</strong>
      <span class="stock ${p.stock <= CONFIG.lowStock ? "low" : ""}">
        ${p.stock} ${esc(p.unit)} available
      </span>
      <span class="price">${peso(p.price)}/${esc(p.unit)}</span>
      <span class="add-label">＋ Add to order</span>
    </button>
  `).join("");

  const order = L.length ? L.map(item => `
    <div class="row">
      <div>
        <strong>${esc(item.p.name)}</strong><br>
        <small>${peso(item.p.price)} / ${esc(item.p.unit)}</small>
      </div>
      <div class="qty">
        <button data-dec="${item.p.id}" aria-label="Decrease quantity">−</button>
        <span>${item.q}</span>
        <button data-inc="${item.p.id}" aria-label="Increase quantity">+</button>
      </div>
      <strong>${peso(item.p.price * item.q)}</strong>
    </div>
  `).join("") : `<p style="color:var(--muted);font-size:.85rem">
    Your cart is empty. Tap a product to get started! 💗
  </p>`;

  return `
    <section class="advert">
      <div>
        <div class="eyebrow">VILLANUEVA MEAT SHOP</div>
        <h2>Good food.<br>Great deals! 💗</h2>
        <p>Fresh cuts for your family's favorite meals.</p>
        <button data-browse>Shop now →</button>
      </div>
      <div class="art" aria-hidden="true">🥩</div>
    </section>

    <section class="delivery-card">
      <div class="delivery-icon">🛵</div>
      <div>
        <strong>How would you like your order?</strong>
        <small>Choose pickup or delivery at checkout.</small>
      </div>
    </section>

    <div class="section-title">
      <span>💗 Our products</span>
      <small>${db.products.length} products</small>
    </div>

    <div class="pos">
      <section>
        <div class="products">${products}</div>
      </section>

      <section class="panel" id="cart-panel">
        <h2>🛍️ My shopping cart</h2>
        ${order}

        <div class="row">
          <label for="disc">Discount (%)</label>
          <input id="disc" class="n" type="number"
            min="0" max="100" step="1" value="${disc}">
        </div>

        <div class="row">
          <label for="fulfillment">Order method</label>
          <select id="fulfillment">
            <option value="Pickup" ${fulfillment === "Pickup" ? "selected" : ""}>
              Pickup
            </option>
            <option value="Delivery" ${fulfillment === "Delivery" ? "selected" : ""}>
              Delivery
            </option>
          </select>
        </div>

        ${fulfillment === "Delivery" ? `
          <div style="padding:10px 0">
            <label for="deliveryAddress">Delivery address</label>
            <textarea id="deliveryAddress" rows="3" maxlength="250"
              placeholder="House number, street, barangay, landmark">${esc(deliveryAddress)}</textarea>
          </div>
        ` : ""}

        <div class="row">
          <label for="pay">Payment method</label>
          <select id="pay">
            ${CONFIG.payments.map(method => `
              <option ${method === pay ? "selected" : ""}>${method}</option>
            `).join("")}
          </select>
        </div>

        <div class="total">
          <span>Total</span>
          <span>${peso(total())}</span>
        </div>

        ${disc > 0 ? `
          <small style="color:var(--muted)">
            You save ${peso(subtotal() - total())}!
          </small>
        ` : ""}

        <button class="cta" data-checkout ${L.length ? "" : "disabled"}>
          Confirm order · ${peso(total())}
        </button>
      </section>
    </div>
  `;
}

/* INVENTORY SCREEN */
function vInv() {
  const rows = db.products.map(p => {
    const status = p.stock <= 0 ? "Out of stock" :
      p.stock <= CONFIG.lowStock ? "Low stock" : "Available";

    return `
      <tr>
        <td>${esc(p.name)}</td>
        <td>
          <input class="n" type="number" min="0.01" step="0.01"
            value="${p.price}" data-price="${p.id}">
        </td>
        <td>${p.stock} ${esc(p.unit)}</td>
        <td><span class="tag ${p.stock <= CONFIG.lowStock ? "low" : "ok"}">
          ${status}
        </span></td>
        <td>
          <input class="n" type="number" min="0.01" step="0.5"
            id="rs${p.id}" placeholder="Qty">
          <button class="small-btn" data-restock="${p.id}">Add</button>
        </td>
      </tr>
    `;
  }).join("");

  return `
    <section class="panel">
      <h2>➕ Add a product</h2>
      <div class="form">
        <input id="np-name" placeholder="Product name" maxlength="40">
        <input id="np-price" type="number" min="0.01" step="0.01"
          placeholder="Price">
        <input id="np-stock" type="number" min="0" step="0.5"
          placeholder="Starting stock">
        <select id="np-unit">
          <option value="kg">kg</option>
          <option value="pc">pc</option>
        </select>
        <button class="small-btn" data-addprod>Add product</button>
      </div>
    </section>

    <section class="panel">
      <h2>📦 Inventory and stock</h2>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Product</th><th>Price</th><th>Stock</th>
            <th>Status</th><th>Restock</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>
  `;
}

/* REPORTS SCREEN */
function vRep() {
  const today = new Date().toDateString();
  const salesToday = db.sales.filter(s =>
    new Date(s.t).toDateString() === today
  );

  const revenueToday = salesToday.reduce((sum, s) => sum + s.total, 0);
  const allRevenue = db.sales.reduce((sum, s) => sum + s.total, 0);
  const lowStock = db.products.filter(p =>
    p.stock <= CONFIG.lowStock
  ).length;

  const rows = db.sales.slice(0, 50).map(s => `
    <tr>
      <td>${s.id}</td>
      <td>${when(s.t)}</td>
      <td>${esc(s.items.map(i => `${i.name} ×${i.q}`).join(", "))}</td>
      <td>${esc(s.fulfillment || "Pickup")}
        ${s.address ? `<br><small>${esc(s.address)}</small>` : ""}
      </td>
      <td>${esc(s.pay)}</td>
      <td>${peso(s.total)}</td>
    </tr>
  `).join("") || `<tr><td colspan="6">No sales recorded yet.</td></tr>`;

  return `
    <div class="stats">
      <div class="stat"><b>${peso(revenueToday)}</b><span>Sales today</span></div>
      <div class="stat"><b>${salesToday.length}</b><span>Orders today</span></div>
      <div class="stat"><b>${peso(allRevenue)}</b><span>All-time sales</span></div>
      <div class="stat"><b>${lowStock}</b><span>Low-stock products</span></div>
    </div>

    <section class="panel">
      <h2>📊 Recent orders</h2>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>#</th><th>Date</th><th>Items</th>
            <th>Order type</th><th>Payment</th><th>Total</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>
  `;
}

/* AUDIT TRAIL SCREEN */
function vLog() {
  const rows = db.log.map(item => `
    <tr>
      <td>${when(item.t)}</td>
      <td><span class="tag">${esc(item.action)}</span></td>
      <td>${esc(item.detail)}</td>
    </tr>
  `).join("") || `<tr><td colspan="3">No activity recorded.</td></tr>`;

  return `
    <section class="panel">
      <h2>🧾 Activity history</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Action</th><th>Details</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>
  `;
}

/* SYSTEM INFORMATION SCREEN */
const DESIGN = [
  ["Effective", "Supports product sales, inventory control, payments, discounts and reports."],
  ["Reliable", "Checks stock, validates inputs and displays messages when actions fail."],
  ["Maintainable", "Uses separate settings, data, screen rendering and event handlers."],
  ["Data design", "Stores products, sales and audit history in browser localStorage."],
  ["User interface", "Uses mobile product cards, bottom navigation and a shopping cart."],
  ["Architecture", "Configuration → data → helper functions → views → actions."],
  ["Data verification", "Validates product names, prices, quantities and discounts."],
  ["Automated records", "Records sale numbers, timestamps, totals and stock deductions."],
  ["Audit trail", "Logs sales, price changes, restocking and newly added products."],
  ["Design trade-offs", "Browser storage is simple but does not synchronize data between devices."]
];

function vDesign() {
  return `
    <section class="panel">
      <h2>⚙️ System information</h2>
      <div class="design-grid">
        ${DESIGN.map(([title, description]) => `
          <div>
            <h3>${esc(title)}</h3>
            <p>${esc(description)}</p>
          </div>
        `).join("")}
      </div>
    </section>
  `;
}

/* RENDER THE SELECTED SCREEN */
function render() {
  $("#nav").innerHTML = TABS.map(([key, label, icon]) => `
    <button role="tab" data-tab="${key}"
      aria-selected="${key === tab}">
      <span class="icon" aria-hidden="true">${icon}</span>
      <span>${label}</span>
    </button>
  `).join("");

  const views = {
    sell:vSell,
    inv:vInv,
    rep:vRep,
    log:vLog,
    design:vDesign
  };

  $("#view").innerHTML = views[tab]();
}

/* CHECKOUT */
function checkout() {
  const L = lines();

  if (!L.length) return toast("Your shopping cart is empty.");

  for (const item of L) {
    if (item.q <= 0 || item.q > item.p.stock) {
      return toast(`Not enough stock for ${item.p.name}.`);
    }
  }

  if (fulfillment === "Delivery" && !deliveryAddress.trim()) {
    return toast("Please enter your delivery address.");
  }

  const sale = {
    id:db.seq++,
    t:Date.now(),
    pay,
    disc,
    total:total(),
    fulfillment,
    address:fulfillment === "Delivery" ? deliveryAddress.trim() : "",
    items:L.map(item => ({
      name:item.p.name,
      q:item.q,
      price:item.p.price
    }))
  };

  L.forEach(item => {
    item.p.stock = round2(item.p.stock - item.q);
  });

  db.sales.unshift(sale);

  audit(
    "SALE",
    `Order #${sale.id}: ${peso(sale.total)}, ${sale.fulfillment}, ${sale.pay}`
  );

  save();

  cart = {};
  disc = 0;
  fulfillment = "Pickup";
  deliveryAddress = "";
  pay = "Cash";

  render();
  toast(`Order #${sale.id} recorded: ${peso(sale.total)}`);
}

/* ADD PRODUCT */
function addProduct() {
  const name = $("#np-name").value.trim();
  const price = parseFloat($("#np-price").value);
  const stock = parseFloat($("#np-stock").value);
  const unit = $("#np-unit").value;

  if (!name) return toast("Enter a product name.");
  if (!(price > 0)) return toast("Price must be above zero.");
  if (!(stock >= 0)) return toast("Stock cannot be negative.");

  if (db.products.some(p =>
    p.name.toLowerCase() === name.toLowerCase()
  )) {
    return toast("That product already exists.");
  }

  db.products.push({
    id:db.seq++,
    name,
    price,
    stock,
    unit
  });

  audit("PRODUCT", `Added ${name}, ${peso(price)}`);
  save();
  render();
  toast("Product added successfully.");
}

/* RESTOCK */
function restock(id) {
  const input = $("#rs" + id);
  const amount = parseFloat(input.value);
  const product = byId(id);

  if (!product) return toast("Product not found.");
  if (!(amount > 0)) return toast("Enter a restock quantity.");

  product.stock = round2(product.stock + amount);

  audit("RESTOCK", `${product.name}: +${amount} ${product.unit}`);
  save();
  render();
  toast("Stock updated.");
}

/* BUTTON EVENTS */
document.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;

  const d = button.dataset;

  if (d.tab) {
    tab = d.tab;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } else if ("browse" in d) {
    document.querySelector(".section-title")
      ?.scrollIntoView({behavior:"smooth", block:"start"});
  } else if (d.add || d.inc) {
    const id = Number(d.add || d.inc);
    const product = byId(id);

    if (!product) return;

    const quantity = round2((cart[id] || 0) + CONFIG.step);

    if (quantity > product.stock) {
      return toast("Not enough stock available.");
    }

    cart[id] = quantity;
    render();
  } else if (d.dec) {
    const id = Number(d.dec);

    cart[id] = round2((cart[id] || 0) - CONFIG.step);

    if (cart[id] <= 0) delete cart[id];

    render();
  } else if ("checkout" in d) {
    checkout();
  } else if ("addprod" in d) {
    addProduct();
  } else if (d.restock) {
    restock(Number(d.restock));
  }
});

/* INPUT EVENTS */
document.addEventListener("change", event => {
  const el = event.target;

  if (el.id === "disc") {
    const value = Number(el.value);

    if (!Number.isFinite(value) || value < 0 || value > 100) {
      toast("Discount must be between 0 and 100.");
      render();
      return;
    }

    disc = value;
    render();
  } else if (el.id === "pay") {
    pay = el.value;
  } else if (el.id === "fulfillment") {
    fulfillment = el.value;
    render();
  } else if (el.id === "deliveryAddress") {
    deliveryAddress = el.value;
  } else if (el.dataset.price) {
    const product = byId(Number(el.dataset.price));
    const value = parseFloat(el.value);

    if (!product || !(value > 0)) {
      toast("Price must be above zero.");
      render();
      return;
    }

    audit("PRICE", `${product.name}: ${peso(product.price)} → ${peso(value)}`);
    product.price = value;

    save();
    render();
    toast("Price updated.");
  }
});

/* START APP */
load();
render();
</script>
</body>
</html>
